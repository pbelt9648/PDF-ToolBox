<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กล่องเครื่องมือ PDF ส่วนตัว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#11161b;
    --panel:#171e25;
    --card:#1e2731;
    --card-hover:#243040;
    --border:#2b3742;
    --accent:#e8a33d;
    --accent-dim:#7a5a26;
    --teal:#4fb3a9;
    --pink:#d97ba0;
    --text:#eef2f0;
    --muted:#8ea1ab;
    --danger:#d9695f;
    --radius:10px;
    font-family:'Kanit',sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 10% -10%, #1b2530 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px;}

  /* header */
  header{
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
    padding:18px 20px;border:1px solid var(--border);border-radius:var(--radius);
    background:linear-gradient(135deg, var(--panel), #141a20);
    margin-bottom:18px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:44px;height:44px;border-radius:8px;
    background:repeating-linear-gradient(45deg, var(--accent), var(--accent) 4px, #c8862b 4px, #c8862b 8px);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow: inset 0 0 0 2px #00000030;
  }
  .brand-mark svg{width:24px;height:24px;}
  .brand h1{font-size:1.28rem;font-weight:800;margin:0;letter-spacing:.2px;}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:.82rem;}
  .privacy-badge{
    display:flex;align-items:center;gap:8px;
    background:#132420;border:1px solid #2c5347;color:#7fd7c4;
    padding:8px 12px;border-radius:999px;font-size:.78rem;font-weight:500;
    white-space:nowrap;
  }
  .privacy-badge svg{width:14px;height:14px;flex-shrink:0;}

  /* tool nav - pegboard */
  nav.tools{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(128px,1fr));
    gap:10px;margin-bottom:20px;
  }
  nav.tools button{
    font-family:'Kanit',sans-serif;
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    color:var(--text);padding:14px 10px 12px;cursor:pointer;text-align:left;
    display:flex;flex-direction:column;gap:8px;position:relative;
    transition:.15s ease;
  }
  nav.tools button::before{
    content:"";position:absolute;top:10px;right:10px;width:6px;height:6px;border-radius:50%;
    background:var(--border);
  }
  nav.tools button:hover{background:var(--card-hover);border-color:#3a4956;}
  nav.tools button.active{border-color:var(--accent);background:#26201533;box-shadow:0 0 0 1px var(--accent) inset;}
  nav.tools button.active::before{background:var(--accent);}
  nav.tools .icon{
    width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    background:#0000002e;
  }
  nav.tools .icon svg{width:17px;height:17px;}
  nav.tools .label{font-size:.83rem;font-weight:600;line-height:1.25;}

  /* main panel */
  main{
    border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);
    padding:22px;min-height:340px;
  }
  .panel-title{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
  .panel-title h2{font-size:1.15rem;margin:0;font-weight:700;}
  .panel-title .tag{
    font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--accent);
    border:1px solid var(--accent-dim);padding:1px 7px;border-radius:5px;
  }
  .panel-desc{color:var(--muted);font-size:.85rem;margin:0 0 18px;line-height:1.55;}

  .dropzone{
    border:2px dashed var(--border);border-radius:var(--radius);padding:26px 16px;
    text-align:center;cursor:pointer;transition:.15s;background:#141b21;
  }
  .dropzone:hover, .dropzone.drag{border-color:var(--accent);background:#1c1710;}
  .dropzone svg{width:26px;height:26px;color:var(--muted);margin-bottom:8px;}
  .dropzone p{margin:0;font-size:.88rem;color:var(--muted);}
  .dropzone strong{color:var(--text);}
  input[type=file]{display:none;}

  .filelist{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .filelist li{
    display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);
    border-radius:8px;padding:9px 10px;font-size:.85rem;
  }
  .filelist li .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .filelist li .fsize{color:var(--muted);font-size:.76rem;font-family:'JetBrains Mono',monospace;}
  .filelist li .fbtns{display:flex;gap:4px;}
  .icon-btn{
    background:#000000000;border:1px solid var(--border);color:var(--muted);border-radius:6px;
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  }
  .icon-btn:hover{border-color:var(--accent);color:var(--accent);}
  .icon-btn svg{width:13px;height:13px;}
  .icon-btn.danger:hover{border-color:var(--danger);color:var(--danger);}

  .controls{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:.78rem;color:var(--muted);}
  .field select, .field input[type=text], .field input[type=number]{
    font-family:'Kanit',sans-serif;background:var(--card);border:1px solid var(--border);color:var(--text);
    border-radius:7px;padding:8px 10px;font-size:.88rem;min-width:140px;
  }
  .field select:focus, .field input:focus{outline:none;border-color:var(--accent);}
  input[type=range]{accent-color:var(--accent);}

  .btn{
    font-family:'Kanit',sans-serif;font-weight:600;font-size:.9rem;
    border:none;border-radius:8px;padding:11px 20px;cursor:pointer;
    background:var(--accent);color:#241a08;transition:.15s;
  }
  .btn:hover{background:#f0b258;}
  .btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;}
  .btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn.secondary:hover{border-color:var(--teal);color:var(--teal);}
  .btn-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center;}

  .status{margin-top:14px;font-size:.83rem;color:var(--muted);min-height:1.2em;}
  .status.error{color:var(--danger);}
  .status.ok{color:#7fd7c4;}

  .result{
    margin-top:16px;padding:14px;border:1px solid #2c5347;background:#0f1c19;border-radius:var(--radius);
    display:none;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .result.show{display:flex;}
  .result .info{font-size:.85rem;}
  .result .info b{color:#7fd7c4;}
  .result a.dl{
    background:var(--teal);color:#08211d;font-weight:700;text-decoration:none;
    padding:9px 16px;border-radius:8px;font-size:.85rem;
  }

  /* thumbnails grid for reorder tool */
  .thumbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:16px;}
  .thumb{
    background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px;
    display:flex;flex-direction:column;gap:6px;cursor:grab;position:relative;
  }
  .thumb.dragging{opacity:.35;}
  .thumb canvas{width:100%;border-radius:4px;display:block;background:#fff;}
  .thumb .pageno{font-size:.68rem;color:var(--muted);text-align:center;font-family:'JetBrains Mono',monospace;}
  .thumb .thumbtools{position:absolute;top:8px;right:8px;display:flex;gap:3px;}
  .thumb .thumbtools button{
    width:20px;height:20px;border-radius:5px;border:1px solid var(--border);background:#11161bcc;
    color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .thumb .thumbtools button:hover{color:var(--accent);border-color:var(--accent);}
  .thumb.removed{opacity:.25;}
  .thumb.removed canvas{filter:grayscale(1);}

  .grid2{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:640px){.grid2{grid-template-columns:1fr 1fr;}}

  .imgprev-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:14px;}
  .imgprev{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px;position:relative;}
  .imgprev img{width:100%;height:80px;object-fit:cover;border-radius:5px;display:block;}
  .imgprev .rmv{position:absolute;top:9px;right:9px;width:20px;height:20px;border-radius:5px;background:#11161bd0;border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .imgprev .rmv:hover{color:var(--danger);border-color:var(--danger);}
  .imgprev .idx{font-size:.68rem;color:var(--muted);text-align:center;margin-top:4px;font-family:'JetBrains Mono',monospace;}

  footer{text-align:center;color:var(--muted);font-size:.76rem;margin-top:26px;line-height:1.7;}
  footer a{color:var(--teal);}
  code{font-family:'JetBrains Mono',monospace;background:#0000003a;padding:1px 5px;border-radius:4px;font-size:.85em;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#241a08" stroke-width="2.2"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>
      </div>
      <div>
        <h1>กล่องเครื่องมือ PDF ส่วนตัว</h1>
        <p>ทำงานในเบราว์เซอร์ของคุณล้วนๆ</p>
      </div>
    </div>
    <div class="privacy-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      ไฟล์ไม่ถูกอัปโหลดขึ้นเซิร์ฟเวอร์
    </div>
  </header>

  <nav class="tools" id="toolNav"></nav>

  <main id="panelHost"></main>

  <footer>
    ทุกเครื่องมือประมวลผลด้วย JavaScript ในเครื่องคุณ (pdf-lib / pdf.js) — ปิดเน็ตแล้วยังใช้งานได้<br>
    ทำโดย Claude ให้ Puwit · เวอร์ชันเริ่มต้น จะทยอยเพิ่มเครื่องมืออื่นทีหลัง
  </footer>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const { PDFDocument, degrees, rgb, StandardFonts } = PDFLib;

/* ---------- helpers ---------- */
function fmtBytes(b){
  if(b < 1024) return b + " B";
  if(b < 1024*1024) return (b/1024).toFixed(1) + " KB";
  return (b/1024/1024).toFixed(2) + " MB";
}
function download(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function readAsArrayBuffer(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsArrayBuffer(file);
  });
}
function iconSvg(paths, extra=""){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${paths}</svg>`;
}
function setupDropzone(zone, input, onFiles, multiple){
  zone.addEventListener('click', ()=>input.click());
  input.addEventListener('change', e=>onFiles([...e.target.files]));
  ['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev, e=>{e.preventDefault();zone.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>zone.addEventListener(ev, e=>{e.preventDefault();zone.classList.remove('drag');}));
  zone.addEventListener('drop', e=>{
    const files = [...e.dataTransfer.files];
    onFiles(multiple ? files : files.slice(0,1));
  });
}

/* ---------- tool registry ---------- */
const ICONS = {
  merge: iconSvg('<rect x="3" y="4" width="12" height="15" rx="1.5"/><rect x="9" y="7" width="12" height="15" rx="1.5" fill="none"/>'),
  split: iconSvg('<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M4 12h16" stroke-dasharray="3 3"/>'),
  reorder: iconSvg('<rect x="3" y="4" width="8" height="6" rx="1"/><rect x="13" y="4" width="8" height="6" rx="1"/><rect x="3" y="14" width="8" height="6" rx="1"/><rect x="13" y="14" width="8" height="6" rx="1"/>'),
  pageno: iconSvg('<rect x="5" y="3" width="14" height="18" rx="1.5"/><text x="12" y="17" font-size="7" fill="currentColor" stroke="none" text-anchor="middle">12</text>'),
  jpg2pdf: iconSvg('<rect x="3" y="4" width="12" height="12" rx="1.5"/><circle cx="7" cy="8" r="1.4" fill="currentColor" stroke="none"/><path d="M4 14l3-3 2 2 4-4 3 3"/><path d="M17 8h4M19 6v4"/>'),
  pdf2jpg: iconSvg('<rect x="4" y="3" width="12" height="14" rx="1.5"/><circle cx="20" cy="16" r="3.4"/><path d="M11 6h3M11 9h3"/>'),
  compress: iconSvg('<path d="M8 3v6a2 2 0 0 1-2 2H0" transform="translate(4 0)"/><path d="M16 21v-6a2 2 0 0 1 2-2h6" transform="translate(-4 0)"/><path d="M4 4l5 5M20 20l-5-5"/>'),
  pdfcompress: iconSvg('<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 3v6a2 2 0 0 1-2 2H3" transform="translate(2 -1)"/><path d="M15 21v-6a2 2 0 0 1 2-2h4" transform="translate(-2 1)"/>')
};

const TOOLS = [
  {id:'merge', label:'รวมไฟล์ PDF', icon:ICONS.merge},
  {id:'split', label:'แยกไฟล์ PDF', icon:ICONS.split},
  {id:'reorder', label:'จัดหน้า PDF', icon:ICONS.reorder},
  {id:'pageno', label:'ใส่เลขหน้า PDF', icon:ICONS.pageno},
  {id:'jpg2pdf', label:'JPG → PDF', icon:ICONS.jpg2pdf},
  {id:'pdf2jpg', label:'PDF → JPG', icon:ICONS.pdf2jpg},
  {id:'compress', label:'ลดขนาดรูปภาพ', icon:ICONS.compress},
  {id:'pdfcompress', label:'ลดขนาด PDF', icon:ICONS.pdfcompress},
];

const nav = document.getElementById('toolNav');
const host = document.getElementById('panelHost');

TOOLS.forEach(t=>{
  const btn = document.createElement('button');
  btn.innerHTML = `<div class="icon">${t.icon}</div><div class="label">${t.label}</div>`;
  btn.onclick = ()=>selectTool(t.id);
  btn.dataset.id = t.id;
  nav.appendChild(btn);
});

function selectTool(id){
  [...nav.children].forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  host.innerHTML = '';
  RENDERERS[id](host);
}

/* ================= MERGE ================= */
function renderMerge(host){
  host.innerHTML = `
    <div class="panel-title"><h2>รวมไฟล์ PDF</h2><span class="tag">merge</span></div>
    <p class="panel-desc">เลือกไฟล์ PDF หลายไฟล์ แล้วจัดลำดับก่อน-หลังด้วยปุ่มลูกศร จากนั้นกดรวมไฟล์</p>
    <div class="dropzone" id="mzDrop">
      ${iconSvg('<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 21h16"/>')}
      <p><strong>แตะเพื่อเลือกไฟล์</strong> หรือลากไฟล์ PDF มาวางที่นี่</p>
    </div>
    <input type="file" id="mzInput" accept="application/pdf" multiple>
    <ul class="filelist" id="mzList"></ul>
    <div class="btn-row">
      <button class="btn" id="mzGo" disabled>รวมไฟล์ PDF</button>
      <button class="btn secondary" id="mzClear">ล้างรายการ</button>
    </div>
    <div class="status" id="mzStatus"></div>
    <div class="result" id="mzResult"><div class="info"></div><a class="dl" download>ดาวน์โหลด</a></div>
  `;
  let files = [];
  const list = host.querySelector('#mzList');
  const go = host.querySelector('#mzGo');
  const status = host.querySelector('#mzStatus');
  const result = host.querySelector('#mzResult');

  function renderList(){
    list.innerHTML = '';
    files.forEach((f,i)=>{
      const li = document.createElement('li');
      li.innerHTML = `
        <span class="fname">${i+1}. ${f.name}</span>
        <span class="fsize">${fmtBytes(f.size)}</span>
        <span class="fbtns">
          <button class="icon-btn" data-act="up" data-i="${i}">${iconSvg('<path d="M12 19V5M5 12l7-7 7 7"/>')}</button>
          <button class="icon-btn" data-act="down" data-i="${i}">${iconSvg('<path d="M12 5v14M19 12l-7 7-7-7"/>')}</button>
          <button class="icon-btn danger" data-act="rm" data-i="${i}">${iconSvg('<path d="M18 6L6 18M6 6l12 12"/>')}</button>
        </span>`;
      list.appendChild(li);
    });
    go.disabled = files.length < 2;
    result.classList.remove('show');
  }
  list.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    const i = +b.dataset.i, act = b.dataset.act;
    if(act==='up' && i>0) [files[i-1],files[i]]=[files[i],files[i-1]];
    if(act==='down' && i<files.length-1) [files[i+1],files[i]]=[files[i],files[i+1]];
    if(act==='rm') files.splice(i,1);
    renderList();
  });
  setupDropzone(host.querySelector('#mzDrop'), host.querySelector('#mzInput'), fl=>{
    files = files.concat(fl.filter(f=>f.type==='application/pdf' || f.name.toLowerCase().endsWith('.pdf')));
    renderList();
  }, true);
  host.querySelector('#mzClear').onclick = ()=>{files=[];renderList();status.textContent='';};

  go.onclick = async ()=>{
    go.disabled = true; status.className='status'; status.textContent='กำลังรวมไฟล์...';
    try{
      const merged = await PDFDocument.create();
      for(const f of files){
        const buf = await readAsArrayBuffer(f);
        const src = await PDFDocument.load(buf);
        const pages = await merged.copyPages(src, src.getPageIndices());
        pages.forEach(p=>merged.addPage(p));
      }
      const bytes = await merged.save();
      const blob = new Blob([bytes], {type:'application/pdf'});
      status.className='status ok'; status.textContent=`เสร็จแล้ว รวม ${files.length} ไฟล์`;
      result.classList.add('show');
      result.querySelector('.info').innerHTML = `ไฟล์ผลลัพธ์ · <b>${fmtBytes(blob.size)}</b>`;
      const a = result.querySelector('a.dl');
      a.href = URL.createObjectURL(blob); a.download = 'merged.pdf';
    }catch(err){
      status.className='status error'; status.textContent='เกิดข้อผิดพลาด: '+err.message;
    }
    go.disabled = files.length < 2;
  };
  renderList();
}

/* ================= SPLIT ================= */
function renderSplit(host){
  host.innerHTML = `
    <div class="panel-title"><h2>แยกไฟล์ PDF</h2><span class="tag">split</span></div>
    <p class="panel-desc">อัปโหลด PDF หนึ่งไฟล์ ระบุช่วงหน้าที่ต้องการดึงออกมาเป็นไฟล์ใหม่ เช่น ไฟล์ 100 หน้า อยากได้เฉพาะหน้า 20 ถึง 45 ให้พิมพ์ <code>20-45</code> หรือระบุหลายช่วง/หลายหน้าพร้อมกันได้ เช่น <code>1-3,5,8-9</code></p>
    <div class="dropzone" id="spDrop">
      ${iconSvg('<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 21h16"/>')}
      <p><strong>แตะเพื่อเลือกไฟล์ PDF</strong> หรือลากมาวางที่นี่</p>
    </div>
    <input type="file" id="spInput" accept="application/pdf">
    <div id="spInfo" class="status"></div>
    <div class="controls" id="spControls" style="display:none;">
      <div class="field">
        <label>ช่วงหน้าที่ต้องการ</label>
        <input type="text" id="spRange" placeholder="เช่น 1-3,5,8-9">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" id="spGo" disabled>แยกหน้าออกมา</button>
    </div>
    <div class="status" id="spStatus"></div>
    <div class="result" id="spResult"><div class="info"></div><a class="dl" download>ดาวน์โหลด</a></div>
  `;
  let file=null, pageCount=0;
  const info = host.querySelector('#spInfo');
  const controls = host.querySelector('#spControls');
  const go = host.querySelector('#spGo');
  const status = host.querySelector('#spStatus');
  const result = host.querySelector('#spResult');
  const rangeInput = host.querySelector('#spRange');

  setupDropzone(host.querySelector('#spDrop'), host.querySelector('#spInput'), async fl=>{
    if(!fl[0]) return;
    file = fl[0];
    info.className='status'; info.textContent='กำลังอ่านไฟล์...';
    const buf = await readAsArrayBuffer(file);
    const doc = await PDFDocument.load(buf);
    pageCount = doc.getPageCount();
    info.className='status ok';
    info.textContent = `${file.name} · ${pageCount} หน้า · ${fmtBytes(file.size)}`;
    controls.style.display='flex';
    go.disabled=false;
    result.classList.remove('show');
  }, false);

  go.onclick = async ()=>{
    const raw = rangeInput.value.trim();
    if(!raw){ status.className='status error'; status.textContent='กรุณาระบุช่วงหน้า'; return; }
    let indices = [];
    try{
      raw.split(',').forEach(part=>{
        part = part.trim();
        if(!part) return;
        if(part.includes('-')){
          const [a,b] = part.split('-').map(n=>parseInt(n.trim(),10));
          for(let p=a;p<=b;p++) indices.push(p-1);
        } else {
          indices.push(parseInt(part,10)-1);
        }
      });
      indices = indices.filter(i=>i>=0 && i<pageCount);
      if(!indices.length) throw new Error('ไม่มีหมายเลขหน้าที่ถูกต้องในช่วงที่ระบุ');
    }catch(err){
      status.className='status error'; status.textContent='รูปแบบช่วงหน้าไม่ถูกต้อง: '+err.message; return;
    }
    go.disabled = true; status.className='status'; status.textContent='กำลังแยกไฟล์...';
    try{
      const buf = await readAsArrayBuffer(file);
      const src = await PDFDocument.load(buf);
      const out = await PDFDocument.create();
      const pages = await out.copyPages(src, indices);
      pages.forEach(p=>out.addPage(p));
      const bytes = await out.save();
      const blob = new Blob([bytes], {type:'application/pdf'});
      status.className='status ok'; status.textContent = `แยกออกมาแล้ว ${indices.length} หน้า`;
      result.classList.add('show');
      result.querySelector('.info').innerHTML = `ไฟล์ผลลัพธ์ · <b>${fmtBytes(blob.size)}</b>`;
      const a = result.querySelector('a.dl');
      a.href = URL.createObjectURL(blob); a.download = 'split.pdf';
    }catch(err){
      status.className='status error'; status.textContent='เกิดข้อผิดพลาด: '+err.message;
    }
    go.disabled=false;
  };
}

/* ================= REORDER (จัดหน้า) ================= */
function renderReorder(host){
  host.innerHTML = `
    <div class="panel-title"><h2>จัดหน้า PDF</h2><span class="tag">reorder</span></div>
    <p class="panel-desc">อัปโหลด PDF แล้วลากสลับลำดับหน้า หมุนหรือลบหน้าที่ไม่ต้องการ จากนั้นบันทึกเป็นไฟล์ใหม่</p>
    <div class="dropzone" id="roDrop">
      ${iconSvg('<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 21h16"/>')}
      <p><strong>แตะเพื่อเลือกไฟล์ PDF</strong> หรือลากมาวางที่นี่</p>
    </div>
    <input type="file" id="roInput" accept="application/pdf">
    <div class="status" id="roStatus"></div>
    <div class="thumbgrid" id="roGrid"></div>
    <div class="btn-row" id="roActions" style="display:none;">
      <button class="btn" id="roGo">บันทึกไฟล์ใหม่</button>
      <button class="btn secondary" id="roReset">โหลดใหม่</button>
    </div>
    <div class="result" id="roResult"><div class="info"></div><a class="dl" download>ดาวน์โหลด</a></div>
  `;
  let pdfBuf=null, pages=[]; // {origIndex, rotation, removed}
  const grid = host.querySelector('#roGrid');
  const status = host.querySelector('#roStatus');
  const actions = host.querySelector('#roActions');
  const result = host.querySelector('#roResult');
  let dragFrom = null;

  async function loadFile(file){
    status.className='status'; status.textContent='กำลังโหลดและสร้างภาพตัวอย่าง...';
    grid.innerHTML=''; actions.style.display='none'; result.classList.remove('show');
    pdfBuf = await readAsArrayBuffer(file);
    const pdf = await pdfjsLib.getDocument({data: pdfBuf.slice(0)}).promise;
    pages = [];
    for(let i=0;i<pdf.numPages;i++){
      const page = await pdf.getPage(i+1);
      const viewport = page.getViewport({scale: 0.35});
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
      pages.push({origIndex:i, rotation:0, removed:false, dataUrl: canvas.toDataURL('image/png')});
    }
    status.className='status ok'; status.textContent = `${pdf.numPages} หน้า — ลากเพื่อจัดลำดับ`;
    actions.style.display='flex';
    renderGrid();
  }

  function renderGrid(){
    grid.innerHTML='';
    pages.forEach((p, idx)=>{
      const div = document.createElement('div');
      div.className = 'thumb' + (p.removed?' removed':'');
      div.draggable = true;
      div.dataset.idx = idx;
      div.innerHTML = `
        <div class="thumbtools">
          <button data-act="rotate" title="หมุน">${iconSvg('<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>')}</button>
          <button data-act="toggle" title="ลบ/คืนค่า">${iconSvg('<path d="M18 6L6 18M6 6l12 12"/>')}</button>
        </div>
        <img src="${p.dataUrl}" style="transform:rotate(${p.rotation}deg); width:100%; border-radius:4px;">
        <div class="pageno">หน้า ${p.origIndex+1}</div>
      `;
      grid.appendChild(div);
    });
  }
  grid.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    const idx = +b.closest('.thumb').dataset.idx;
    if(b.dataset.act==='rotate') pages[idx].rotation = (pages[idx].rotation+90)%360;
    if(b.dataset.act==='toggle') pages[idx].removed = !pages[idx].removed;
    renderGrid();
  });
  grid.addEventListener('dragstart', e=>{
    const t = e.target.closest('.thumb'); if(!t) return;
    dragFrom = +t.dataset.idx; t.classList.add('dragging');
  });
  grid.addEventListener('dragend', e=>{
    const t = e.target.closest('.thumb'); if(t) t.classList.remove('dragging');
  });
  grid.addEventListener('dragover', e=>e.preventDefault());
  grid.addEventListener('drop', e=>{
    e.preventDefault();
    const t = e.target.closest('.thumb'); if(!t || dragFrom===null) return;
    const dragTo = +t.dataset.idx;
    if(dragFrom===dragTo) return;
    const [moved] = pages.splice(dragFrom,1);
    pages.splice(dragTo,0,moved);
    dragFrom=null;
    renderGrid();
  });

  setupDropzone(host.querySelector('#roDrop'), host.querySelector('#roInput'), fl=>{
    if(fl[0]) loadFile(fl[0]);
  }, false);
  host.querySelector('#roReset').onclick = ()=>{ host.querySelector('#roInput').value=''; grid.innerHTML=''; actions.style.display='none'; status.textContent=''; result.classList.remove('show'); };

  host.querySelector('#roGo').onclick = async ()=>{
    status.className='status'; status.textContent='กำลังบันทึก...';
    try{
      const src = await PDFDocument.load(pdfBuf);
      const out = await PDFDocument.create();
      const keep = pages.filter(p=>!p.removed);
      if(!keep.length) throw new Error('ต้องเหลืออย่างน้อย 1 หน้า');
      const copied = await out.copyPages(src, keep.map(p=>p.origIndex));
      copied.forEach((cp, i)=>{
        const rot = keep[i].rotation;
        if(rot) cp.setRotation(degrees((cp.getRotation().angle||0) + rot));
        out.addPage(cp);
      });
      const bytes = await out.save();
      const blob = new Blob([bytes], {type:'application/pdf'});
      status.className='status ok'; status.textContent = `บันทึกแล้ว ${keep.length} หน้า`;
      result.classList.add('show');
      result.querySelector('.info').innerHTML = `ไฟล์ผลลัพธ์ · <b>${fmtBytes(blob.size)}</b>`;
      const a = result.querySelector('a.dl');
      a.href = URL.createObjectURL(blob); a.download = 'reordered.pdf';
    }catch(err){
      status.className='status error'; status.textContent='เกิดข้อผิดพลาด: '+err.message;
    }
  };
}

/* ================= JPG -> PDF ================= */
function renderJpg2Pdf(host){
  host.innerHTML = `
    <div class="panel-title"><h2>JPG / PNG → PDF</h2><span class="tag">image-to-pdf</span></div>
    <p class="panel-desc">เลือกรูปภาพหลายรูป จัดลำดับ แล้วรวมเป็น PDF หนึ่งไฟล์ (หนึ่งรูปต่อหนึ่งหน้า)</p>
    <div class="dropzone" id="jpDrop">
      ${iconSvg('<circle cx="9" cy="9" r="2"/><path d="M4 16l5-5 4 4 6-6 3 3" /><rect x="3" y="3" width="18" height="18" rx="2"/>')}
      <p><strong>แตะเพื่อเลือกรูปภาพ</strong> หรือลากมาวางที่นี่ (เลือกได้หลายรูป)</p>
    </div>
    <input type="file" id="jpInput" accept="image/jpeg,image/png,image/webp" multiple>
    <div class="imgprev-list" id="jpList"></div>
    <div class="controls">
      <div class="field">
        <label>ขนาดหน้ากระดาษ</label>
        <select id="jpSize">
          <option value="fit">พอดีกับรูปภาพ</option>
          <option value="a4">A4</option>
        </select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" id="jpGo" disabled>แปลงเป็น PDF</button>
      <button class="btn secondary" id="jpClear">ล้างรายการ</button>
    </div>
    <div class="status" id="jpStatus"></div>
    <div class="result" id="jpResult"><div class="info"></div><a class="dl" download>ดาวน์โหลด</a></div>
  `;
  let files = [];
  const list = host.querySelector('#jpList');
  const go = host.querySelector('#jpGo');
  const status = host.querySelector('#jpStatus');
  const result = host.querySelector('#jpResult');

  function renderList(){
    list.innerHTML='';
    files.forEach((f,i)=>{
      const url = URL.createObjectURL(f);
      const div = document.createElement('div');
      div.className='imgprev';
      div.innerHTML = `<button class="rmv" data-i="${i}">${iconSvg('<path d="M18 6L6 18M6 6l12 12"/>')}</button><img src="${url}"><div class="idx">${i+1}</div>`;
      list.appendChild(div);
    });
    go.disabled = files.length===0;
    result.classList.remove('show');
  }
  list.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    files.splice(+b.dataset.i,1); renderList();
  });
  setupDropzone(host.querySelector('#jpDrop'), host.querySelector('#jpInput'), fl=>{
    files = files.concat(fl.filter(f=>f.type.startsWith('image/')));
    renderList();
  }, true);
  host.querySelector('#jpClear').onclick = ()=>{files=[];renderList();status.textContent='';};

  go.onclick = async ()=>{
    go.disabled=true; status.className='status'; status.textContent='กำลังสร้าง PDF...';
    try{
      const doc = await PDFDocument.create();
      const sizeMode = host.querySelector('#jpSize').value;
      for(const f of files){
        const buf = await readAsArrayBuffer(f);
        const isPng = f.type==='image/png';
        let img;
        if(isPng) img = await doc.embedPng(buf);
        else {
          // convert webp or ensure jpeg via canvas if needed
          if(f.type==='image/jpeg') img = await doc.embedJpg(buf);
          else {
            const converted = await convertToJpegBuffer(f);
            img = await doc.embedJpg(converted);
          }
        }
        let pw, ph, drawW, drawH, x=0, y=0;
        if(sizeMode==='a4'){
          pw=595.28; ph=841.89;
          const scale = Math.min(pw/img.width, ph/img.height);
          drawW = img.width*scale; drawH = img.height*scale;
          x=(pw-drawW)/2; y=(ph-drawH)/2;
        } else {
          pw=img.width; ph=img.height; drawW=pw; drawH=ph;
        }
        const page = doc.addPage([pw,ph]);
        page.drawImage(img, {x,y,width:drawW,height:drawH});
      }
      const bytes = await doc.save();
      const blob = new Blob([bytes], {type:'application/pdf'});
      status.className='status ok'; status.textContent=`สร้าง PDF สำเร็จ ${files.length} หน้า`;
      result.classList.add('show');
      result.querySelector('.info').innerHTML = `ไฟล์ผลลัพธ์ · <b>${fmtBytes(blob.size)}</b>`;
      const a = result.querySelector('a.dl');
      a.href = URL.createObjectURL(blob); a.download = 'images.pdf';
    }catch(err){
      status.className='status error'; status.textContent='เกิดข้อผิดพลาด: '+err.message;
    }
    go.disabled=false;
  };
}
function convertToJpegBuffer(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      canvas.getContext('2d').drawImage(img,0,0);
      canvas.toBlob(blob=>{
        blob.arrayBuffer().then(resolve).catch(reject);
      }, 'image/jpeg', 0.92);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

    <div class="btn-row"><button class="btn" id="czGo" disabled>บีบอัดทั้งหมด</button></div>
    <div class="status" id="czStatus"></div>
    <div id="czResults" style="display:flex;flex-direction:column;gap:8px;margin-top:14px;"></div>
  `;
  let files=[];
  const go = host.querySelector('#czGo');
  const status = host.querySelector('#czStatus');
  const results = host.querySelector('#czResults');
  const qSlider = host.querySelector('#czQuality');
  const qVal = host.querySelector('#czQval');
  qSlider.addEventListener('input', ()=>qVal.textContent = qSlider.value);

  setupDropzone(host.querySelector('#czDrop'), host.querySelector('#czInput'), fl=>{
    files = files.concat(fl.filter(f=>f.type.startsWith('image/')));
    go.disabled = files.length===0;
    status.className='status'; status.textContent = `เลือกแล้ว ${files.length} ไฟล์`;
    results.innerHTML='';
  }, true);

  go.onclick = async ()=>{
    go.disabled=true; results.innerHTML=''; status.className='status'; status.textContent='กำลังบีบอัด...';
    const quality = qSlider.value/100;
    const maxDim = parseInt(host.querySelector('#czMaxDim').value,10);
    for(const f of files){
      try{
        const {blob, w, h} = await compressImage(f, quality, maxDim);
        const row = document.createElement('div');
        row.className='result show';
        row.style.marginTop='0';
        row.innerHTML = `<div class="info">${f.name} · <b>${fmtBytes(f.size)}</b> → <b>${fmtBytes(blob.size)}</b> (${w}×${h}) — ลดลง ${(100-(blob.size/f.size*100)).toFixed(0)}%</div>`;
        const a = document.createElement('a');
        a.className='dl'; a.textContent='ดาวน์โหลด';
        a.href = URL.createObjectURL(blob);
        a.download = f.name.replace(/\.[^.]+$/,'') + '-compressed.jpg';
        row.appendChild(a);
        results.appendChild(row);
      }catch(err){
        const row = document.createElement('div');
        row.className='status error'; row.textContent = `${f.name}: ${err.message}`;
        results.appendChild(row);
      }
    }
    status.className='status ok'; status.textContent='บีบอัดเสร็จแล้ว';
    go.disabled=false;
  };
}
function compressImage(file, quality, maxDim){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(maxDim && Math.max(w,h) > maxDim){
        const scale = maxDim / Math.max(w,h);
        w = Math.round(w*scale); h = Math.round(h*scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>{
        if(!blob) return reject(new Error('แปลงไฟล์ไม่สำเร็จ'));
        resolve({blob, w, h});
      }, 'image/jpeg', quality);
    };
    img.onerror = ()=>reject(new Error('เปิดรูปภาพไม่ได้'));
    img.src = URL.createObjectURL(file);
  });
}

/* ================= COMPRESS PDF ================= */
function renderPdfCompress(host){
  host.innerHTML = `
    <div class="panel-title"><h2>ลดขนาด PDF</h2><span class="tag">compress-pdf</span></div>
    <p class="panel-desc">
      บีบอัดโดยแปลงแต่ละหน้าเป็นภาพคุณภาพต่ำลงแล้วประกอบกลับเป็น PDF — ได้ไฟล์เล็กลงมาก เหมาะกับ PDF ที่สแกนมาหรือมีรูปภาพเยอะ<br>
      <b style="color:var(--accent)">ข้อควรรู้:</b> วิธีนี้ทำให้ข้อความในไฟล์กลายเป็นภาพ จะคัดลอก/ค้นหาข้อความในไฟล์ผลลัพธ์ไม่ได้อีก ถ้าไฟล์เป็นเอกสารพิมพ์ (มีตัวอักษรจริง ไม่ใช่รูปสแกน) และต้องคัดลอกข้อความได้ ไม่แนะนำให้ใช้เครื่องมือนี้
    </p>
    <div class="dropzone" id="pcDrop">
      ${iconSvg('<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 21h16"/>')}
      <p><strong>แตะเพื่อเลือกไฟล์ PDF</strong> หรือลากมาวางที่นี่</p>
    </div>
    <input type="file" id="pcInput" accept="application/pdf">
    <div class="status" id="pcInfo"></div>
    <div class="controls" id="pcControls" style="display:none;">
      <div class="field">
        <label>ความละเอียด</label>
        <select id="pcDpi">
          <option value="72">ต่ำสุด (ไฟล์เล็กสุด)</option>
          <option value="100" selected>ปานกลาง (แนะนำ)</option>
          <option value="150">สูง (อ่านง่ายกว่า)</option>
        </select>
      </div>
      <div class="field">
        <label>คุณภาพ (<span id="pcQval">65</span>%)</label>
        <input type="range" id="pcQuality" min="20" max="90" value="65">
      </div>
    </div>
    <div class="btn-row"><button class="btn" id="pcGo" disabled>บีบอัด PDF</button></div>
    <div class="status" id="pcStatus"></div>
    <div class="result" id="pcResult"><div class="info"></div><a class="dl" download>ดาวน์โหลด</a></div>
  `;
  let file=null;
  const info = host.querySelector('#pcInfo');
  const controls = host.querySelector('#pcControls');
  const go = host.querySelector('#pcGo');
  const status = host.querySelector('#pcStatus');
  const result = host.querySelector('#pcResult');
  const qSlider = host.querySelector('#pcQuality');
  const qVal = host.querySelector('#pcQval');
  qSlider.addEventListener('input', ()=>qVal.textContent = qSlider.value);

  setupDropzone(host.querySelector('#pcDrop'), host.querySelector('#pcInput'), async fl=>{
    if(!fl[0]) return;
    file = fl[0];
    const buf = await readAsArrayBuffer(file);
    const doc = await PDFDocument.load(buf);
    info.className='status ok';
    info.textContent = `${file.name} · ${doc.getPageCount()} หน้า · ${fmtBytes(file.size)}`;
    controls.style.display='flex'; go.disabled=false; result.classList.remove('show');
  }, false);

  go.onclick = async ()=>{
    go.disabled=true; status.className='status'; status.textContent='กำลังบีบอัด กรุณารอสักครู่ (ไฟล์หน้าเยอะจะใช้เวลานานหน่อย)...';
    try{
      const targetDpi = parseInt(host.querySelector('#pcDpi').value,10);
      const quality = qSlider.value/100;
      const renderScale = targetDpi/72;
      const buf = await readAsArrayBuffer(file);
      const pdf = await pdfjsLib.getDocument({data: buf.slice(0)}).promise;
      const out = await PDFDocument.create();
      for(let i=0;i<pdf.numPages;i++){
        status.textContent = `กำลังประมวลผลหน้า ${i+1} / ${pdf.numPages}...`;
        const page = await pdf.getPage(i+1);
        const baseViewport = page.getViewport({scale:1});
        const renderViewport = page.getViewport({scale: renderScale});
        const canvas = document.createElement('canvas');
        canvas.width = renderViewport.width; canvas.height = renderViewport.height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
        await page.render({canvasContext: ctx, viewport: renderViewport}).promise;
        const jpegBuf = await new Promise((res,rej)=>{
          canvas.toBlob(blob=>{
            if(!blob) return rej(new Error('แปลงหน้า '+(i+1)+' ไม่สำเร็จ'));
            blob.arrayBuffer().then(res).catch(rej);
          }, 'image/jpeg', quality);
        });
        const img = await out.embedJpg(jpegBuf);
        const newPage = out.addPage([baseViewport.width, baseViewport.height]);
        newPage.drawImage(img, {x:0, y:0, width:baseViewport.width, height:baseViewport.height});
      }
      const bytes = await out.save();
      const blob = new Blob([bytes], {type:'application/pdf'});
      const pct = (100 - (blob.size/file.size*100)).toFixed(0);
      status.className='status ok'; status.textContent = `เสร็จแล้ว`;
      result.classList.add('show');
      result.querySelector('.info').innerHTML = `${fmtBytes(file.size)} → <b>${fmtBytes(blob.size)}</b> (เล็กลง ${pct}%)`;
      const a = result.querySelector('a.dl');
      a.href = URL.createObjectURL(blob); a.download = 'compressed.pdf';
    }catch(err){
      status.className='status error'; status.textContent='เกิดข้อผิดพลาด: '+err.message;
    }
    go.disabled=false;
  };
}
